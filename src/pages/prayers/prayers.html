<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orações — Universo de Luz</title>
<link rel="icon" type="image/svg+xml" href="/public/img/logo.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/public/img/logo-192.png">


<style>@view-transition { navigation: auto }</style>
<link rel="stylesheet" href="/src/transicao.css">
<link rel="stylesheet" href="/src/pages/prayers/prayers.css">
<!-- Depois da folha da página, e não por @import dentro dela: o layout de
     celular das três páginas mora aqui, e quem vem depois é quem manda numa
     disputa de mesma especificidade. Um @import chegaria antes de tudo, que
     é o contrário do que se quer. -->
<link rel="stylesheet" href="/src/pages/comum/encaixe.css">
</head>

<body>

<!-- Porte de site-antigo/site-UL/src/pages/prayers/prayer.tsx.
     O <MobileScrollFactory> era um componente que só envolvia a seção e
     pendurava os gestos: virou esta <section> mais `comum/rolagem.js`.
     As abas, o título, a barra de progresso e os cards são desenhados pelo
     JS, porque no original eram estado do React. -->
<section class="prayer-section" style="height: 100svh; overflow: hidden">

  <!-- <Background /> -->
  <div class="fundo">
    <img src="/src/pages/comum/img/fundo.jpg" alt="" class="fundo__img">
    <div class="fundo__escuro"></div>
    <div class="fundo__vinheta"></div>
  </div>

  <div class="prayer-sticky">

    <!-- ── PAINEL ESQUERDO ── -->
    <div class="prayer-panel-left">
      <div class="prayer-tabs"></div>
      <div class="prayer-title-area"></div>
      <div class="prayer-scroll-indicator"></div>
    </div>

    <!-- ── PAINEL DIREITO: CARDS ── -->
    <div class="prayer-panel-right">
      <!-- <BackgroundSnake /> — o JS preenche -->
      <div class="snake-bg"></div>

      <div class="prayer-cards-viewport"></div>
    </div>

  </div>
</section>

<script type="importmap">
{
  "imports": {
    "gsap": "/public/lib/gsap/index.js"
  }
}
</script>
<script type="module" src="/src/pages/prayers/prayers.js"></script>
</body>
</html>
