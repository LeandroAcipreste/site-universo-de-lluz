<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube — Universo de Luz</title>
<link rel="icon" type="image/svg+xml" href="/public/img/logo.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/public/img/logo-192.png">

<!-- Caminhos a partir da raiz: a página é servida em `/youtube` por reescrita
     (ver vercel.json), e ali um caminho relativo resolveria para a raiz. -->
<!-- A transição entre páginas, e é a única folha do projeto que vem por
     <link> próprio em vez de por @import.

     Não é desleixo de organização: a regra `@view-transition` e as animações
     `::view-transition-*` precisam ser conhecidas **antes do primeiro
     desenho**. Numa cadeia de importações o navegador só as descobre depois de
     dois pedidos de rede encadeados, e a essa altura já decidiu — por @import
     a transição era descartada ("Transition was skipped") e, quando não era,
     rodava com o esmaecimento padrão em vez do deslize. Como <link> ela é
     baixada em paralelo com a folha da página, e chega a tempo.

     A ativação vai embutida logo abaixo, e não na folha: ela precisa valer
     **sem sequer uma ida à rede**. Medido: só no <link>, a transição voltava a
     ser descartada; embutida, dispara sempre. As animações podem chegar um
     instante depois, a ativação não. -->
<style>@view-transition { navigation: auto }</style>
<link rel="stylesheet" href="/src/transicao.css">
<link rel="stylesheet" href="/src/pages/youtube/youtube.css">
</head>

<body>

<!-- Porte de site-antigo/site-UL/src/pages/youtube/youtube.tsx.
     Lá esta página não tinha folha de estilo: o visual inteiro estava em
     classes do Tailwind dentro do JSX. Elas viraram as classes `yt-*` de
     youtube.css. Os seis cards de playlist são desenhados pelo JS, porque no
     original eram um `.map()` sobre um literal. -->
<section class="yt-section">

  <!-- <Background /> -->
  <div class="fundo">
    <img src="/src/pages/comum/img/fundo.jpg" alt="" class="fundo__img">
    <div class="fundo__escuro"></div>
    <div class="fundo__vinheta"></div>
  </div>

  <!-- <BackgroundSnake /> — o JS preenche -->
  <div class="snake-bg"></div>

  <!-- ── CONTEÚDO PRINCIPAL ── -->
  <div class="yt-content">

    <h1 class="yt-title">
      CONHEÇA NOSSO
      <br>
      <span class="yt-title-gradient">CANAL NO YOUTUBE</span>
    </h1>

    <p class="yt-subtitle">Momento de conexão ao vivo de segunda a sexta às 7:30, sábados, domingos e feriados às 9:00</p>

    <div class="yt-bloco">
      <a class="yt-btn"
         href="https://www.youtube.com/universodeluz"
         target="_blank" rel="noopener noreferrer">
        Acessar Canal
        <!-- <ArrowRight /> do lucide-react 0.544.0 -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"
             class="yt-btn-seta" aria-hidden="true">
          <path d="M5 12h14"/>
          <path d="m12 5 7 7-7 7"/>
        </svg>
      </a>

      <div class="yt-playlists-bloco">
        <p class="yt-playlists-legenda">Separamos algumas playlists especiais para você</p>
        <div class="yt-grade"></div>
      </div>
    </div>

  </div>
</section>

<script type="importmap">
{
  "imports": {
    "gsap": "/public/lib/gsap/index.js",
    "gsap/CustomEase": "/public/lib/gsap/CustomEase.js"
  }
}
</script>
<script type="module" src="/src/pages/youtube/youtube.js"></script>
</body>
</html>
