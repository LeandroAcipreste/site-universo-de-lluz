<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Limpezas — Universo de Luz</title>
<link rel="icon" type="image/svg+xml" href="/public/img/logo.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/public/img/logo-192.png">

<!-- Caminhos a partir da raiz: a página é servida em `/cleansing` por reescrita
     (ver vercel.json), e ali um caminho relativo resolveria para a raiz. -->
<!-- A transição entre páginas, e é a única folha do projeto que vem por
     <link> próprio em vez de por @import.

     Não é desleixo de organização: a regra `@view-transition` e as animações
     `::view-transition-*` precisam ser conhecidas **antes do primeiro
     desenho**. Numa cadeia de importações o navegador só as descobre depois de
     dois pedidos de rede encadeados, e a essa altura já decidiu — por @import
     a transição era descartada ("Transition was skipped") e, quando não era,
     rodava com o esmaecimento padrão em vez do deslize. Como <link> ela é
     baixada em paralelo com a folha da página, e chega a tempo.

     A ativação vai embutida logo abaixo, e não na folha: ela precisa valer
     **sem sequer uma ida à rede**. Medido: só no <link>, a transição voltava a
     ser descartada; embutida, dispara sempre. As animações podem chegar um
     instante depois, a ativação não. -->
<style>@view-transition { navigation: auto }</style>
<link rel="stylesheet" href="/src/transicao.css">
<link rel="stylesheet" href="/src/pages/cleansing/cleansing.css">
</head>

<body>

<!-- Porte de site-antigo/site-UL/src/pages/energyCleasing/energyCleasing.tsx.
     O <MobileScrollFactory> era um componente que só envolvia a seção e
     pendurava os gestos: virou esta <section> mais `comum/rolagem.js`.
     As abas, o título, a barra de progresso e os cards são desenhados pelo
     JS, porque no original eram estado do React. -->
<section class="energy-section" style="height: 100svh; overflow: hidden">

  <!-- <Background /> -->
  <div class="fundo">
    <img src="/src/pages/comum/img/fundo.jpg" alt="" class="fundo__img">
    <div class="fundo__escuro"></div>
    <div class="fundo__vinheta"></div>
  </div>

  <div class="energy-sticky">

    <!-- ── PAINEL ESQUERDO ── -->
    <div class="energy-panel-left">
      <div class="energy-tabs"></div>
      <div class="energy-title-area"></div>
      <div class="energy-scroll-indicator"></div>
    </div>

    <!-- ── PAINEL DIREITO: CARDS ── -->
    <div class="energy-panel-right">
      <!-- <BackgroundSpiral /> — o shader desenha no canvas -->
      <div class="spiral-bg"><canvas class="spiral-bg__canvas"></canvas></div>

      <div class="energy-cards-viewport"></div>
    </div>

  </div>
</section>

<script type="importmap">
{
  "imports": {
    "gsap": "/public/lib/gsap/index.js"
  }
}
</script>
<script type="module" src="/src/pages/cleansing/cleansing.js"></script>
</body>
</html>
